<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script>
        function alerta() {
            var n1 = parseFloat(prompt("Escribe un numero"));
            if (n1 % 2 == 0) {
                alert("El numero " + n1 + " es par")
            } else {
                alert("El numero " + n1 + " es impar");
            }
        }

    </script>
</head>
<body onload="javascript:alerta();">

</body>
</html>
