<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script>
        function alerta() {
            var n = parseFloat(prompt("Escribe un numero"));
            var divisor = 2;
            var resultado = "";

            while (n > 1) {
                if (n % divisor == 0) {
                    resultado = resultado + divisor + " * ";
                    n = n / divisor;
                } else {
                    divisor++;
                }
            }

            alert(resultado);
        }
    </script>
</head>
<body onload="javascript:alerta();">

</body>
</html>
