<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script>
        function alerta(){
            var n1 = parseFloat(prompt("Escribe un numero"));
            var n2 = parseFloat(prompt("Escribe otro numero"));
            var n3 = parseFloat(prompt("Escribe una numero"));

            if (n1 > 10 && n1 < 100 && n2 > 10 && n2 < 100 && n3 > 10 && n3 < 100) {
                alert("Ok");
            } else {
                alert("No cumple");
            }
        }
    </script>
</head>
<body onload="javascript:alerta();">

</body>
</html>
