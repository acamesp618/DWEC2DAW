<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Media, Rango y Moda</title>

  <script>

    function pedirCantidad() {
      let cantidad;

      do {
        cantidad = prompt("¿Cuántos valores quieres introducir?");

        if (cantidad === null) {
          return 0;
        }

        cantidad = Number(cantidad);

        if (cantidad <= 0 || cantidad != parseInt(cantidad)) {
          alert("Introduce un número entero positivo.");
        }

      } while (cantidad <= 0 || cantidad != parseInt(cantidad));

      return cantidad;
    }


    function pedirValores(cantidad) {
      let valores = [];

      for (let i = 0; i < cantidad; i++) {
        let valor;

        do {
          valor = prompt("Introduce el valor " + (i + 1) + ":");

          if (valor === null) {
            return null;
          }

          valor = Number(valor);

          if (valor < 0 || valor != parseInt(valor)) {
            alert("Introduce un número entero positivo o cero.");
          }

        } while (valor < 0 || valor != parseInt(valor));

        valores[i] = valor;
      }

      return valores;
    }


    function calcularMedia(valores) {
      let suma = 0;

      for (let i = 0; i < valores.length; i++) {
        suma = suma + valores[i];
      }

      return suma / valores.length;
    }


    function calcularRango(valores) {
      let menor = valores[0];
      let mayor = valores[0];

      for (let i = 1; i < valores.length; i++) {

        if (valores[i] < menor) {
          menor = valores[i];
        }

        if (valores[i] > mayor) {
          mayor = valores[i];
        }
      }

      return mayor - menor;
    }


    function calcularModa(valores) {
      let moda = valores[0];
      let mayorCantidad = 0;

      for (let i = 0; i < valores.length; i++) {
        let cantidad = 0;

        for (let j = 0; j < valores.length; j++) {

          if (valores[i] == valores[j]) {
            cantidad++;
          }
        }

        if (cantidad > mayorCantidad) {
          mayorCantidad = cantidad;
          moda = valores[i];
        }
      }

      if (mayorCantidad == 1) {
        return "No hay moda";
      }

      return moda;
    }


    function main() {
      let cantidad = pedirCantidad();

      if (cantidad == 0) {
        alert("Programa cancelado.");
        return;
      }

      let valores = pedirValores(cantidad);

      if (valores == null) {
        alert("Programa cancelado.");
        return;
      }

      let media = calcularMedia(valores);
      let rango = calcularRango(valores);
      let moda = calcularModa(valores);

      alert(
              "Valores introducidos: " + valores.join(", ") +
              "\n\nMedia: " + media +
              "\nRango: " + rango +
              "\nModa: " + moda
      );
    }


    main();

  </script>
</head>

<body>

<h1>Media, Rango y Moda</h1>

<p>Abre la página para introducir los valores.</p>

</body>
</html>
