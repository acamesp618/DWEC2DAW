<script>
    function alerta() { /* Función donde sociliza una velocidad */
        var n1 = parseFloat(prompt("Escribe un la velocidad (en km/h) para pasarla a m/s"));

        var sum = n1%3.6;
        alert(sum + " m/s");
    }
</script>
