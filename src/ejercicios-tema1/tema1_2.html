<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

</head>
<body onload="javascript:alerta(); // Aparece una alerta al cargar la pagina">

</body>

</html>

<script> function alerta() { /* Función donde pide el numero de hijos */
    var mensaje;
    var opcion = prompt("¿Numeros de hijos?");

    if (opcion == null || opcion == "") {
        mensaje = "No ha introducido ningun numero";
    } else {
        mensaje = opcion;
    }
    alert("Tiene " + mensaje + " hijos.");
}</script>
