<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script>
        function datos() {
            var x = [];
            for (i= 0; i <3; i++){
                x.push([]);
                for (j=0; j<2; j++){
                    x[i].push(Number(prompt("Introduzca elemento : "+"["+i+"]"+"["+j+"]")))
                }
            }
            parImpar(x);
        }

        function parImpar(x){
            var pares=[];
            var impares=[];
            for (i=0; i<3; i++){
                for (j=0; j<2; j++){
                    if((x[i][j]%2)==0){
                        pares.push(x[i][j]);
                    }else{
                        impares.push(x[i][j]);
                    }
                }
            }
            alert(`Impares: ${impares}\nPares: ${pares}`)
        }
    </script>
</head>
<body onload="datos()">

</body>
</html>
